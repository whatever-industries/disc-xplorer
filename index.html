<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Paint the saved/system theme before the application bundle loads. -->
    <style>
      html { background: #1e1e1e; color-scheme: dark; }
      @media (prefers-color-scheme: light) { html { background: #f5f5f5; color-scheme: light; } }
      html[data-theme="dark"] { background: #1e1e1e; color-scheme: dark; }
      html[data-theme="light"] { background: #f5f5f5; color-scheme: light; }
    </style>
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      } catch { /* System appearance also works when storage is unavailable. */ }
    </script>
    <title>Disc Xplorer</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
