name: Check Bundled Dependencies

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundled-dependency-update
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'whatever-industries/disc-xplorer' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      release: ${{ steps.upstream.outputs.release }}
      tag: ${{ steps.upstream.outputs.tag }}
      ref: ${{ steps.candidate.outputs.ref }}
      branch: ${{ steps.candidate.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Redumper and compatible Cargo encoder updates
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-redumper.mjs

      - name: Save the candidate commit for verification
        id: candidate
        if: steps.upstream.outputs.release == 'true'
        env:
          CHANGED: ${{ steps.upstream.outputs.changed }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$CHANGED" = "true" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .redumper/upstream.json package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json RELEASE_NOTES.md
            git commit -m "Update bundled dependencies"
            BRANCH="automation/dependencies-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git push origin "HEAD:refs/heads/$BRANCH"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            REF=$(git rev-parse HEAD)
          else
            # Retry the commit that reserved this version, even if unrelated
            # commits have reached the default branch since then.
            REF=$(git log -1 --format=%H -S "\"automaticRelease\": \"${TAG#v}\"" -- .redumper/upstream.json)
            test -n "$REF"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
      ref: ${{ needs.check.outputs.ref }}
      publish: true
      merge_default: ${{ needs.check.outputs.changed == 'true' }}
    secrets: inherit

  cleanup:
    needs: [check, release]
    if: always() && needs.check.outputs.branch != ''
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - name: Remove the temporary candidate branch
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
