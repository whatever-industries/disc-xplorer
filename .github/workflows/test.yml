name: Tests

# Deliberately separate from Release. The release workflow only ever built the
# app, so a broken test could ship unnoticed — and did, during a stretch when the
# maintainer's local C toolchain was broken and the suite was running nowhere at
# all. This runs on every push and pull request instead of only on a tag, so the
# signal arrives before a release rather than after one.
#
# It does not gate the release. A tag still builds and publishes even if this is
# red, because blocking a release on CI that has never been exercised would be a
# worse failure than the one it is meant to catch. Revisit once it has a track
# record.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # macos-14 to match the image the release actually builds on, rather than
    # macos-latest. Not cosmetic: the newer image ships CMake 4, which dropped
    # support for cmake_minimum_required(<3.5), and the FLAC sources vendored by
    # libflac-sys still declare one. Testing on an image the release never uses
    # would also mean green tests that prove nothing about the shipped build.
    #
    # macOS rather than Linux so the crate builds without the GTK and WebKit
    # packages a Linux runner would need first.
    runs-on: macos-14
    env:
      # Belt and braces for the CMake policy above, so this keeps working if the
      # macos-14 image is retired and the job moves to a newer one.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Stub the bundled binaries and libraries
        # The bundle declares a redumper sidecar and six C++ runtime dylibs, and
        # tauri-build refuses to start unless every declared path exists. The
        # release workflow downloads and copies the real ones; the tests never
        # load any of them, so placeholders keep this job self-contained instead
        # of depending on a third-party release being reachable.
        #
        # This mirrors the release layout, symlinks included, so the set stays
        # recognisable against tauri.macos.conf.json.
        run: |
          mkdir -p src-tauri/binaries src-tauri/lib
          : > src-tauri/binaries/redumper-aarch64-apple-darwin
          chmod +x src-tauri/binaries/redumper-aarch64-apple-darwin
          for lib in libc++ libc++abi libunwind; do
            : > "src-tauri/lib/$lib.1.0.dylib"
            ln -sf "$lib.1.0.dylib" "src-tauri/lib/$lib.1.dylib"
          done

      - name: Typecheck the frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run the Rust tests
        working-directory: src-tauri
        # The real-disc tests are #[ignore]d: they need disc images no runner
        # has. Everything else runs.
        run: cargo test
