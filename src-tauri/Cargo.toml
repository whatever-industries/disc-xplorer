[package]
name = "tauri-app"
version = "1.9.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iso9660 = { path = "crates/iso9660" }
encoding_rs = "0.8"
# libflac-noogg cmake-builds the vendored libFLAC and links it *statically* —
# never link the system/Homebrew libFLAC: a release app that references
# /opt/homebrew/... crashes at launch (DYLD library missing) on user machines.
flac-bound = { version = "0.3", features = ["libflac-noogg"], default-features = false }
mp3lame-encoder = "0.2.4"
chd = { version = "0.3", features = ["cd_full"] }
flate2 = "1"
zstd = "0.13"
aes = "0.8"
cbc = "0.1"
fs2 = "0.4"
blake3 = "1"
filetime = "0.2"
# WIA/RVZ chunk compressors. Both are pure Rust decoders: no system library to
# link, which is what made the Homebrew libFLAC build crash on user machines.
lzma-rs = "0.3"
bzip2-rs = "0.1"
# Used directly for CAB's MSZIP folders: each block is a raw deflate stream
# primed with the previous block's output, which needs an inflate that can
# back-reference into a shared output buffer.
miniz_oxide = "0.8"
# 3DO signature verification: RSA-512 modexp over an MD5 digest. Pure Rust, so
# nothing new links against a system library.
num-bigint = { version = "0.4", default-features = false }
md-5 = "0.10"

# Desktop only: a second launch (e.g. double-clicking another disc image) hands
# its path to the running window instead of starting a rival instance.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
